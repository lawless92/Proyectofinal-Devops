{{- if .Values.ingressRoute.enabled -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "node-app.fullname"  . }}
  namespace: {{ .Values.ingressRoute.namespace | default .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "node-app.labels"  . | nindent    4 }}
  {{- if .Values.ingressRoute.annotations }}
  annotations:
    {{- toYaml .Values.ingressRoute.annotations | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    {{- toYaml .Values.ingressRoute.entryPoints | nindent 4 }}
  routes:
  - match: {{ .Values.ingressRoute.match | quote }}
    kind: Rule
    services:
    - name: {{ include "node-app.fullname" . }}
      port: {{ .Values.service.port }}
    {{- if .Values.ingressRoute.middlewares }}
    middlewares:
      {{- toYaml .Values.ingressRoute.middlewares | nindent 4 }}
    {{- end }}
  {{- if .Values.ingressRoute.tls.enabled }}
  tls:
    secretName: {{ .Values.ingressRoute.tls.secretName }}
  {{- end }}
{{- end }}
