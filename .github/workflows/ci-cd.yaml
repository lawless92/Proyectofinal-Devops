name: Build and Deploy to AKS

on:
  push:
    branches: [ main ]

env:
  RESOURCE_GROUP_NAME: "Devops-Project-app" # El grupo de recursos de tu Terraform
  CLUSTER_NAME: "Devops-Project-cluster"    # El nombre de tu clúster de Terraform

jobs:
  build_and_push_Docker_image:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "GITHUB_SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image to Docker Hub
        uses: docker/build-push-action@v5
        with:
         context: .
         file: ./Dockerfile
         push: true
         tags: ${{ vars.DOCKERHUB_USERNAME }}/devopsapp:${{ env.GITHUB_SHA_SHORT }}

