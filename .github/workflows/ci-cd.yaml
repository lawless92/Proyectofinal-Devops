name: Build and Deploy to AKS

on:
  push:
    branches: [ main ]

env:
  RESOURCE_GROUP_NAME: "Devops-Project-app" # El grupo de recursos de tu Terraform
  CLUSTER_NAME: "Devops-Project-cluster"    # El nombre de tu clúster de Terraform

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR Login Server
        id: get_acr_server
        run: |
          ACR_SERVER=$(az acr list --resource-group ${{ env.RESOURCE_GROUP_NAME }} --query "[0].loginServer" -o tsv)
          echo "ACR_LOGIN_SERVER=$ACR_SERVER" >> $GITHUB_ENV

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}

      - name: Build and push Docker image to ACR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/my-node-app:${{ github.sha }}

      - name: Set up AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP_NAME }}
          cluster-name: ${{ env.CLUSTER_NAME }}

      - name: Deploy to AKS with Helm
        run: |
          helm upgrade --install node-app ./app-chart \
            --set image.repository=${{ env.ACR_LOGIN_SERVER }}/my-node-app \
            --set image.tag=${{ github.sha }} \
            --namespace default \
            --wait
