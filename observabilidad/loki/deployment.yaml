apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: default
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      # La imagen grafana/loki corre como UID/GID 10001 (no root).
      securityContext:
        fsGroup: 10001
      initContainers:
        - name: loki-volume-permissions
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - mkdir -p /loki/chunks /loki/wal /loki/tsdb-index /loki/tsdb-cache /loki/compactor && chown -R 10001:10001 /loki
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: loki-data-volume
              mountPath: /loki
      containers:
        - name: loki
          image: grafana/loki:3.7.1
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
          args: ["-config.file=/etc/loki/loki-config.yaml"]
          ports:
            - name: http-loki
              containerPort: 3100
          volumeMounts:
            - name: loki-config-volume
              mountPath: /etc/loki/
            - name: loki-data-volume
              mountPath: /loki
      volumes:
        - name: loki-config-volume
          configMap:
            name: loki-config
        - name: loki-data-volume
          persistentVolumeClaim:
            claimName: loki-pvc