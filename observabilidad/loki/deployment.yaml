apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: default
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      # NUEVO: la imagen grafana/loki corre como UID/GID 10001 (no root).
      # Sin fsGroup, el emptyDir se monta como root:root y Loki no puede
      # escribir en /loki/wal, /loki/chunks, /loki/compactor -> crashea
      # al arrancar y el puerto 3100 nunca llega a abrirse.
      securityContext:
        fsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:3.7.1
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          args: ["-config.file=/etc/loki/loki-config.yaml"]
          ports:
            - name: http-loki
              containerPort: 3100
          volumeMounts:
            - name: loki-config-volume
              mountPath: /etc/loki/
            - name: loki-data-volume
              mountPath: /loki
      volumes:
        - name: loki-config-volume
          configMap:
            name: loki-config
        - name: loki-data-volume
          emptyDir: {} # Para producción, usa un PersistentVolume