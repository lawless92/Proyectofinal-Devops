apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: default
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.7.1
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          args: ["-config.file=/etc/loki/loki-config.yaml"]
          ports:
            - name: http-loki
              containerPort: 3100
          volumeMounts:
            - name: loki-config-volume
              mountPath: /etc/loki/
            - name: loki-data-volume
              mountPath: /loki
      volumes:
        - name: loki-config-volume
          configMap:
            name: loki-config
        - name: loki-data-volume
          emptyDir: {} # Para producción, usar  PersistentVolume