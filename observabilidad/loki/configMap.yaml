apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: default
data:
  loki-config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    ingester:
      
      #chunk settings
      chunk_idle_period: 30m
        chunk_target_size: 1572864  # 1.5 MB
        chunk_encoding: snappy
        max_chunk_age: 2h

      #wal settings
      wal:
        enabled: true
        dir: /loki/wal

    # Índice moderno (TSDB + schema v13) en vez de boltdb-shipper/v11
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      filesystem:
        directory: /loki/chunks
      tsdb_shipper:
        active_index_directory: /loki/tsdb-index
        cache_location: /loki/tsdb-cache

    compactor:
      working_directory: /loki/compactor
      delete_request_store: filesystem