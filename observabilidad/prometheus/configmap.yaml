apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |-
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      #metrics for prometheus itself
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      
      # metrics for node-app(application)    
      - job_name: 'node-app'
        metrics_path: /metrics
        static_configs:
          - targets: ['node-app:5000']

    