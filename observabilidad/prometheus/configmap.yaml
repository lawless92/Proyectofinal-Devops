apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |-
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      #metrics for prometheus itself
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      
      # metrics for node-app(application)    
      - job_name: 'node-app'
        metrics_path: /metrics
        static_configs:
          - targets: ['app-node-app.node-app.svc.cluster.local:5000']

      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: '${1}:9100'
            source_labels: [__address__]
            regex: '(.+):\d+'
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance

      - job_name: 'cadvisor'
        honor_timestamps: false
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: '${1}:8080'
            source_labels: [__address__]
            regex: '(.+):\d+'
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance

    