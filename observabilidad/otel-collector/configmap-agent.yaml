apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-agent-conf
  labels:
    app: opentelemetry
    component: otel-agent-conf
  namespace: otel
data:
  otel-agent-config: |
    extensions:
      zpages:
        endpoint: 0.0.0.0:55679

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318

      hostmetrics:
        collection_interval: 30s
        scrapers:
          cpu:
          memory:
          disk:
          filesystem:
          network:

      # NUEVO: aquí es donde realmente se recolectan los logs del nodo.
      # El operator "container" detecta automáticamente el formato de
      # containerd/CRI-O (timestamp, stream, log) sin necesitar un regex manual.
      filelog:
        include: ["/var/log/pods/*/*/*.log"]
        include_file_path: true
        include_file_name: false
        start_at: beginning
        operators:
          - type: container

    processors:
      # Prevent memory issues
      memory_limiter:
        # 80% of maximum memory up to 2G
        limit_mib: 400
        # 25% of limit up to 2G
        spike_limit_mib: 100
        check_interval: 5s

      # Detect and add resource attributes about the host
      resourcedetection:
        detectors: [env, system]
        timeout: 5s

      # NUEVO: enriquece cada log/trace/metric con metadata del pod
      # (namespace, pod name, container name, labels). Requiere el
      # ServiceAccount + RBAC del archivo rbac.yaml.
      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.container.name
            - k8s.node.name

      batch: {}

    exporters:
      # Todo se reenvía al Collector central, que centraliza la
      # exportación real hacia Loki/backend de trazas.
      otlp/gateway:
        endpoint: "otel-collector.otel.svc.cluster.local:4317"
        tls:
          insecure: true
        sending_queue:
          num_consumers: 4
          queue_size: 100
        retry_on_failure:
          enabled: true

    service:
      extensions: [zpages]
      pipelines:
        traces:
          receivers: [otlp_grpc]
          processors: [memory_limiter, resource_detection, k8s_attributes, batch]
          exporters: [otlp/gateway]

        logs:
          receivers: [file_log]
          processors: [memory_limiter, k8s_attributes, batch]
          exporters: [otlp/gateway]

        metrics:
          receivers: [host_metrics, otlp_grpc]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [otlp/gateway]