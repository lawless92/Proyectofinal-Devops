apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-conf
  labels:
    app: opentelemetry
    component: otel-collector-conf
  namespace: otel
data:
  otel-collector-config: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        limit_mib: 1500
        spike_limit_mib: 512
        check_interval: 5s
      batch: {}
      attributes:
        actions:
          - key: cluster
            action: insert
            value: "local"

    exporters:
      # Loki 3.x tiene ingesta OTLP nativa (endpoint /otlp). Loki mapea
      # automáticamente los resource attributes de k8s (namespace, pod,
      # container, node) que ya vienen del k8sattributes del agent a
      # labels de índice, sin exporter deprecado ni hints manuales.
      otlphttp/loki:
        endpoint: "http://loki-service.default.svc.cluster.local:3100/otlp"
        tls:
          insecure: true
      debug: {}

    service:
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch, attributes]
          exporters: [otlphttp/loki, debug]

        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]

        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]