apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-ingressroute 
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`grafana.local.com`)
      services:
        - name: grafana-service
          port: 80
          scheme: http
  tls:
    # Indica a Traefik que use el secreto que 'cert-manager' creará.
    # El nombre debe coincidir con el 'secretName' del recurso Certificate.
    secretName: grafana-tls-secret